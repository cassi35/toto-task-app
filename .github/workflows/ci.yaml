name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  NODE_ENV: test
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit -- test/unit/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Check Docker (Testcontainers)
        run: docker info
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: test-secret
      SENDER_EMAIL_FROM_GMAIL: test@mail.com
      SENHA_DE_APP: test
      CLIENT_ID: test
      CLIENT_SECRET_GOOGLE: test
      REFRESH_TOKEN: test
      EMAIL_USER: test@mail.com
      CLIENT_ID_AUTH: test
      CLIENT_SECRET_AUTH: test
      CLIENT_SECRET_AZURE: test
      TENANT_ID: test
      CLIENT_ID_AZURE: test
      MICROSOFT_AUTH_URL: ${{ secrets.MICROSOFT_AUTH_URL }}
      GOOGLE_AUTH_URL: ${{ secrets.GOOGLE_AUTH_URL }}
      GOOGLE_LOGIN: ${{ secrets.GOOGLE_LOGIN }}
      MICROSOFT_LOGIN: ${{ secrets.MICROSOFT_LOGIN }}
      FRONTEND_URL_DEV: ${{ secrets.FRONTEND_URL_DEV }}
      RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      PORT: ${{ secrets.PORT }}
      REDIS: ${{ secrets.REDIS }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e -- test/e2e/

  deploy:
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
