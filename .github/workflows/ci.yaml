name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  NODE_ENV: test
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit -- test/unit/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Check Docker (Testcontainers)
        run: docker info
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: test-secret
      SENDER_EMAIL_FROM_GMAIL: test@mail.com
      SENHA_DE_APP: test
      CLIENT_ID: test
      CLIENT_SECRET_GOOGLE: test
      REFRESH_TOKEN: test
      EMAIL_USER: test@mail.com
      CLIENT_ID_AUTH: test
      CLIENT_SECRET_AUTH: test
      CLIENT_SECRET_AZURE: test
      TENANT_ID: test
      CLIENT_ID_AZURE: test
      MICROSOFT_AUTH_URL: http://localhost/microsoft/callback
      GOOGLE_AUTH_URL: http://localhost/google/callback
      GOOGLE_LOGIN: https://accounts.google.com/o/oauth2/v2/auth?
      MICROSOFT_LOGIN: https://login.microsoftonline.com/common/oauth2/v2.0/authorize?
      FRONTEND_URL_DEV: http://localhost:3000
      RENDER_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e -- test/e2e/

  deploy:
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
