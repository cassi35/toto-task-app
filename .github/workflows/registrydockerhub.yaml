name: Publish Docker Hub Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read

env:
  IMAGE_NAME: toto-task-app
  DOCKERFILE_PATH: Dockerfile.prod

jobs:
  push-dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Define image tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "SAFE_REF_NAME=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/_' '-')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build project image
        run: docker build -f "${DOCKERFILE_PATH}" --tag "${IMAGE_NAME}:build-${SHORT_SHA}" .

      - name: Tag and push image to Docker Hub
        env:
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/toto-task-app
        run: |
          docker tag "${IMAGE_NAME}:build-${SHORT_SHA}" "${DOCKERHUB_REPOSITORY}:sha-${SHORT_SHA}"
          docker push "${DOCKERHUB_REPOSITORY}:sha-${SHORT_SHA}"

          docker tag "${IMAGE_NAME}:build-${SHORT_SHA}" "${DOCKERHUB_REPOSITORY}:${SAFE_REF_NAME}"
          docker push "${DOCKERHUB_REPOSITORY}:${SAFE_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            docker tag "${IMAGE_NAME}:build-${SHORT_SHA}" "${DOCKERHUB_REPOSITORY}:latest"
            docker push "${DOCKERHUB_REPOSITORY}:latest"
          fi
